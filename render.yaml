services:
  - type: web
    name: loom-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL
        value: openrouter/free
      - key: ADMIN_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
